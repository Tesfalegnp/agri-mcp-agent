[project]
name = "agricultural-assistant"
version = "0.1.0"
description = "Agricultural MCP Assistant for crop diagnostics, weather advisories, and farm observations"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Hope", email = "hope@example.com" }
]
dependencies = [
    "mcp>=2.3.0,<3.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.50.0",
    "google-genai>=2.31.0",
    "fastapi>=0.151.0",
]

[project.scripts]
agricultural-assistant-server = "agricultural_assistant.server.app:main"
agricultural-assistant = "agricultural_assistant.client.cli:main"
agricultural-assistant-api = "agricultural_assistant.api.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agricultural_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
